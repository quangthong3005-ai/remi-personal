<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remi – trợ lý cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFBFF; --surface:#FFFFFF; --ink:#131A2E; --muted:#667091; --line:#ECEFF7;
  --accent:#EE5A14; --accent-soft:#FFEDE3; --accent-text:#B3410F;
  --ai:#6A5CF0; --ai-soft:#EEEBFF; --ai-text:#4B3FD0;
  --ok:#0FB5A0; --ok-soft:#DDF6F2; --warn:#C2410C; --warn-soft:#FFE8DC;
  --shadow:0 1px 2px rgba(19,26,46,.03),0 8px 24px rgba(106,92,240,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) and (min-width:99999px){
  :root:not([data-theme="light"]){
    --bg:#0E1324; --surface:#171E35; --ink:#EEF1FA; --muted:#98A2C3; --line:#26304F;
    --accent-soft:#3A2418; --accent-text:#FFB08A; --ai-soft:#262352; --ai-text:#BDB5FF;
    --ok-soft:#0F3A36; --warn-soft:#3C2216; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1324; --surface:#171E35; --ink:#EEF1FA; --muted:#98A2C3; --line:#26304F;
  --accent-soft:#3A2418; --accent-text:#FFB08A; --ai-soft:#262352; --ai-text:#BDB5FF;
  --ok-soft:#0F3A36; --warn-soft:#3C2216; --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg) linear-gradient(180deg,#FFEFD6 0,#F6F1FF 240px,var(--bg) 520px) top/100% 520px no-repeat;color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:22px 18px 120px}

/* header */
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.next{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.next b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}

/* composer */
.composer{margin-top:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:16px 16px 12px;box-shadow:var(--shadow);transition:border-color .15s}
.composer:focus-within{border-color:var(--ai)}
.composer .lab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ai-text)}
.composer .lab svg{flex:none}
.composer textarea{display:block;width:100%;margin-top:8px;border:0;background:transparent;resize:none;outline:none;font-size:17px;line-height:1.45;min-height:56px;color:var(--ink)}
.composer textarea::placeholder{color:var(--muted)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.ex{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:10px;scrollbar-width:none}
.ex::-webkit-scrollbar{display:none}
.ex button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.ex button:active{background:var(--ai-soft);color:var(--ai-text)}
.cbtns{display:flex;gap:8px;margin-left:auto}
.icon-btn{width:46px;height:46px;border-radius:16px;border:0;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
.icon-btn.rec{background:var(--warn-soft);color:var(--warn)}
.send{background:var(--accent);color:#fff;width:auto;padding:0 18px;gap:8px;display:flex;align-items:center;font-weight:600;border-radius:16px;height:46px;border:0}
.send:disabled{opacity:.6}
.thinking{display:none;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--ai-text);font-weight:500}
.composer.busy .thinking{display:flex}
.pulse{display:inline-flex;gap:4px}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--ai);animation:pl 1s infinite ease-in-out}
.pulse i:nth-child(2){animation-delay:.15s}.pulse i:nth-child(3){animation-delay:.3s}
@keyframes pl{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

[hidden]{display:none!important}
/* quick tiles */
.quick{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qtile{border:0;border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--ink);font-size:13px;line-height:1.25;min-height:112px;transition:transform .12s}
.qtile:active{transform:scale(.97)}
.qtile b{font-weight:600}
.qtile .qi{width:48px;height:48px;border-radius:16px;background:var(--surface);display:grid;place-items:center;font-size:25px;box-shadow:0 2px 8px rgba(19,26,46,.06)}
.t-rem{background:var(--accent-soft)}.t-cal{background:var(--ai-soft)}.t-hab{background:var(--ok-soft)}
/* composer bar */
.composer{margin-top:14px;padding:8px 8px 8px 16px;border-radius:24px}
.cwrap{display:flex;align-items:center;gap:8px}
.spark{color:var(--ai);display:grid;place-items:center;flex:none}
.composer textarea{margin-top:0;min-height:0;height:44px;padding:10px 0;line-height:24px;overflow:hidden;flex:1;min-width:0;width:auto}
.cwrap .cbtns{margin-left:0}
.cwrap .icon-btn{width:44px;height:44px;border-radius:14px}
.cwrap .send{height:44px;border-radius:14px}
.composer .thinking{margin:4px 0 6px}
/* suggestions */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sgrid button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-size:14px;font-weight:500;line-height:1.3}
.sgrid button:active{background:var(--bg)}
.sgrid .se{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--ai-soft)}
.sgrid button:nth-child(3n+1) .se{background:var(--accent-soft)}
.sgrid button:nth-child(3n) .se{background:var(--ok-soft)}
.aibtn{width:100%;height:48px;border-radius:16px;border:1.5px solid var(--ai);background:var(--ai-soft);color:var(--ai-text);font-weight:600;margin-top:18px}
.aibtn + .sbtns{margin-top:10px}
/* sections */
h2{font-size:17px;font-weight:700;margin:26px 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;font-weight:500;margin-left:6px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:20px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* banner */
.banner{margin-top:16px;background:var(--ai-soft);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;font-size:14px}
.banner p{margin:0;flex:1}
.banner button{border:0;background:var(--ai);color:#fff;border-radius:12px;padding:9px 14px;font-weight:600;flex:none}

/* task */
.task{display:grid;grid-template-columns:62px 1fr 42px;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.time b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.time span{font-size:12px;color:var(--muted)}
.tbody{min-width:0}
.tbody h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);font-weight:500}
.chip.lead{background:var(--accent-soft);color:var(--accent-text)}
.chip.ai{background:var(--ai-soft);color:var(--ai-text)}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.check{width:40px;height:40px;border-radius:14px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--ok)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done{opacity:.6}
.task.done h3{text-decoration:line-through}
.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.task.open .detail{display:block}
.detail p{margin:0 0 10px;color:var(--muted)}
.detail h4{margin:12px 0 6px;font-size:13px;font-weight:600}
.cl{list-style:none;margin:0;padding:0}
.cl label{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.cl input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.cl .q{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.cl input:checked + span{text-decoration:line-through;color:var(--muted)}
.tips{margin:0;padding-left:18px;color:var(--muted)}
.tips li{margin:3px 0}
.linkbtn{border:0;background:none;color:var(--warn);font-size:13px;font-weight:600;padding:8px 0;margin-top:6px}

/* habits */
.hrow{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hcard{flex:none;width:210px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hcard.full{width:auto;margin-bottom:10px}
.hhead{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .e{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}
.hhead h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.hhead p{margin:2px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:8px}
.hbtns button{flex:1;border:0;border-radius:12px;padding:9px 8px;font-weight:600;background:var(--ok-soft);color:#08766A}
:root[data-theme="dark"] .hbtns button{color:#6EE7D6}
@media (prefers-color-scheme: dark) and (min-width:99999px){:root:not([data-theme="light"]) .hbtns button{color:#6EE7D6}}
.hbtns button.ghost{flex:none;background:var(--bg);color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;font-size:12px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--accent-text);background:var(--accent-soft);font-weight:600}

/* alerts */
#alerts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;padding:0 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.alert{pointer-events:auto;max-width:496px;width:100%;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 32px rgba(0,0,0,.25);animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.alert .em{font-size:26px;line-height:1}
.alert .tx{flex:1;min-width:0}
.alert b{display:block;font-size:15px}
.alert span{font-size:13px;opacity:.85}
.alert .acts{display:flex;gap:8px;margin-top:8px}
.alert .acts button{border:0;border-radius:10px;padding:7px 12px;font-weight:600;background:var(--accent);color:#fff}
.alert .x{border:0;background:none;color:inherit;opacity:.7;font-size:20px;line-height:1;padding:0 2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));z-index:41;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}
.understood{border-radius:16px;background:var(--ai-soft);color:var(--ai-text);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field input,.field select{width:100%;height:46px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:0 12px;font-size:16px}
.title-in{font-size:20px!important;font-weight:700;height:54px!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .blk{margin-top:16px}
.sheet .blk h4{margin:0 0 6px;font-size:14px}
.sheet .li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sheet .li:last-child{border-bottom:0}
.sheet .li span:last-child{color:var(--muted)}
.sbtns{display:flex;gap:10px;margin-top:22px}
.sbtns button{height:52px;border-radius:16px;border:0;font-weight:700;font-size:16px}
.sbtns .pri{flex:1;background:var(--accent);color:#fff}
.sbtns .sec{background:var(--bg);color:var(--muted);padding:0 20px}

.sgrid{display:flex;flex-wrap:wrap;gap:8px}
.sgrid button{padding:7px 16px 7px 7px;border-radius:999px;font-weight:600;font-size:15px}
.sgrid .se{width:32px;height:32px;border-radius:50%;font-size:18px}
.qtile{color:#fff;font-size:14px}
.qtile b{font-weight:700}
.qtile .qi{background:rgba(255,255,255,.96)}
.t-rem{background:#E8500A}.t-cal{background:#5B4BF5}.t-hab{background:#0B8F7C}
input[type=datetime-local]{display:block;width:100%;min-width:0;max-width:100%;text-align:left;-webkit-appearance:none;appearance:none}
.sheet{overflow-x:hidden}
.understood{padding:8px 12px;font-size:13px;border-radius:14px;align-items:center}
.hrow2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:18px;flex:none}
#welcome{position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,#FFE3C2,#F3EEFF 60%,#EAF8F5);display:grid;place-items:center;padding:24px}
.wbox{width:100%;max-width:400px;text-align:center}
.wlogo{width:76px;height:76px;border-radius:24px;background:var(--accent);display:grid;place-items:center;font-size:38px;margin:0 auto 18px;box-shadow:0 12px 28px rgba(238,90,20,.3)}
.wbox h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;color:#131A2E;line-height:1.2}
.wbox p{margin:8px 0 18px;color:#4B5470;font-size:16px}
.wbox input{width:100%;height:56px;border-radius:18px;border:2px solid #fff;background:#fff;font-size:20px;font-weight:600;text-align:center;color:#131A2E;outline:none;box-shadow:0 6px 18px rgba(19,26,46,.08)}
.wbox input:focus{border-color:var(--ai)}
.pri2{margin-top:12px;width:100%;height:54px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-weight:700;font-size:17px}
.wbox small{display:block;margin-top:16px;color:#6B7490;font-size:12px}
.tones{display:flex;gap:8px;flex-wrap:wrap}
.tone{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:600;color:var(--muted)}
.tone.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.prev{margin-top:16px;background:#131A2E;color:#fff;border-radius:18px;padding:12px 14px;font-size:14px}
.icons{display:flex;flex-wrap:wrap;gap:8px}
.ico{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:22px;padding:0}
.ico.on{border-color:var(--accent);background:var(--accent-soft)}
.trow{display:flex;gap:8px;margin-top:10px}
.trow input{flex:1;min-width:0}
.addt{border:0;border-radius:14px;background:var(--ai);color:#fff;font-weight:600;padding:0 18px}
.tchip{border:0;cursor:pointer;font-size:14px;padding:7px 12px}
input[type=time]{display:block;text-align:left;-webkit-appearance:none;appearance:none;min-width:0}
.days{display:flex;gap:6px}
.day{flex:1;min-width:0;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:13px;color:var(--muted);padding:0}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dhint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.more{margin-top:12px}
.more summary{font-weight:600;font-size:14px;color:var(--muted);padding:8px 0;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:'＋ '}
.more[open] summary::before{content:'− '}
.sleep{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.sleep .sinfo{flex:1;min-width:0}
.sleep .sinfo b{display:block;font-size:16px}
.sleep .sinfo span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.strack{position:relative;flex:none;width:112px;height:52px;border-radius:26px;background:linear-gradient(135deg,#2B2F6B,#5B4BF5);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;transition:background .25s}
.strack.on{background:linear-gradient(135deg,#FFC933,#FF8A3D)}
.sthumb{position:absolute;top:4px;left:4px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:left .22s cubic-bezier(.2,.8,.2,1)}
.strack.on .sthumb{left:calc(100% - 48px)}
.strack.drag .sthumb{transition:none}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(19,26,46,.12)}
.dl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:4px}
.top .dl p{margin:0}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--accent-text);white-space:nowrap}
.clock small{font-size:14px;font-weight:600;color:var(--muted)}
.sugchip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.addrow{display:flex;gap:8px;margin:10px 0 0}
.addrow input{flex:1;min-width:0;height:46px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:0 12px;font-size:16px}
.shopbox{margin-top:8px;border:1.5px solid var(--line);border-radius:18px;background:var(--bg);overflow:hidden}
.sbar{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface);border-bottom:1.5px solid var(--line);color:var(--muted)}
.sbar input{flex:1;min-width:0;height:48px;border:0;background:transparent;font-size:16px;outline:none;color:var(--ink)}
.slist{max-height:300px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.shead{position:sticky;top:0;z-index:1;background:var(--bg);padding:9px 14px 6px;font-size:12px;font-weight:700;color:var(--muted)}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:9px 14px;text-align:left;font-size:15px;color:var(--ink)}
.srow .plus{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:18px;line-height:1;flex:none}
.srow .sname{flex:1;min-width:0}
.srow .sqty{font-size:13px;color:var(--muted);flex:none}
.srow.on .plus{background:var(--ok);color:#fff;font-size:14px}
.srow.new{font-weight:600;color:var(--ai-text);background:var(--ai-soft)}
.srow.new .plus{background:var(--ai);color:#fff}
.task{cursor:pointer}
.sx{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);font-size:16px;z-index:2}
.note{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.45;resize:vertical;min-height:84px;outline:none}
.note:focus{border-color:var(--ai)}
.lh,.lrow{display:grid;grid-template-columns:26px 1fr 148px 28px;gap:6px;align-items:center}
.lh{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;padding:0 2px}
.lrow{padding:6px 2px;border-bottom:1px solid var(--line)}
.lrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
.ln.d{text-decoration:line-through;color:var(--muted)}
.lq{height:38px;width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:0 8px;font-size:14px}
.lx{border:0;background:none;color:var(--muted);font-size:20px;padding:0}
.calnow{margin-top:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.calh{display:flex;align-items:center;gap:8px;margin-top:10px}
.calh h2{margin:0;flex:1;font-size:19px}

.calh .todaybtn{width:auto;padding:0 14px;font-size:14px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border-color:transparent}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1/1.05;border:0;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;color:var(--ink);padding:0;border:1px solid var(--line)}
.cd b{font-weight:600}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cd.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.dots{display:flex;gap:3px;height:6px}
.dots i,.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
.d1{background:var(--accent)}.d2{background:var(--ok)}.d3{background:var(--ai)}
.cd.sel .dots i{background:#fff}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.daypanel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.dayhead h3{margin:0;font-size:16px}
.dayhead .addt{height:38px;white-space:nowrap;flex:none}
.dayhead h3{line-height:1.3}
.ag{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 2px;font-size:15px;color:var(--ink)}
.ag .at{width:46px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.ag .an{flex:1;min-width:0;font-weight:500}
.ag em{font-style:normal;font-size:12px;color:var(--muted)}
.ag .anote{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.ag.dn .an{text-decoration:line-through;color:var(--muted)}
.shead2{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 2px}
.nowline{display:flex;align-items:center;gap:8px;color:var(--accent-text);font-size:12px;font-weight:700;margin:6px 0}
.nowline::before,.nowline::after{content:'';flex:1;height:2px;background:var(--accent);opacity:.45;border-radius:2px}
.hcard{cursor:pointer}
.donechk{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600;font-size:15px}
.donechk input{width:24px;height:24px;accent-color:var(--ok)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 14px 8px 8px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot span{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;background:transparent}
.slot.on{border-color:var(--ok);background:var(--ok-soft)}
.slot.on span{background:var(--ok);border-color:var(--ok)}
.wicon{width:120px;height:120px;margin:0 auto 20px;filter:drop-shadow(0 16px 24px rgba(238,90,20,.38))}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.qs button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;line-height:1;color:var(--ink);padding:0;flex:none}

.qlist{margin-top:2px}
.qrow{display:grid;grid-template-columns:1fr auto 28px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}
.qn{min-width:0;font-weight:500}


/* ===================== Bố cục thích ứng theo màn hình ===================== */
/* Điện thoại (mặc định): một cột, thanh điều hướng dưới. Thứ tự giữ như cũ nhờ `order`. */
#app{display:flex;flex-direction:column}
.col{display:contents}
.top{order:0}
#sleep{order:1}
#quick{order:2}
.col-main #composer{order:3}
#suggest{order:4}
#today-habits{order:5}
#app main{order:6}
nav.tabs .brand{display:none}
.calgrid{display:block}

/* Máy tính bảng dựng đứng: vẫn một cột nhưng rộng rãi hơn, danh sách chia hai cột. */
@media (min-width:640px){
  #app{max-width:760px;padding:30px 28px 130px}
  nav.tabs div{max-width:680px}
  #view-habits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;align-items:start}
  #view-habits>h2,#view-habits>.empty,#view-habits>.send{grid-column:1/-1}
  #view-habits>.send{justify-self:start}
  .hcard.full{margin-bottom:0}
  #view-habits .hcard.full{margin-bottom:14px}
  .hrow{flex-wrap:wrap;overflow:visible}
  .hrow .hcard{width:calc(50% - 5px)}
}

/* Cửa sổ chi tiết hiện giữa màn hình (thay cho khung trượt từ dưới lên) khi đủ rộng. */
@media (min-width:700px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;margin:0;width:min(600px,calc(100vw - 48px));max-width:none;max-height:min(88vh,860px);
    border-radius:28px;padding:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;visibility:hidden;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s,visibility 0s .22s}
  body.sheet-open .sheet{transform:translate(-50%,-50%);opacity:1;visibility:visible;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s,visibility 0s}
  .sheet .grab{display:none}
  .sx{top:18px;right:18px}
  #alerts{left:auto;right:24px;top:24px;width:min(420px,calc(100vw - 48px));padding:0}
  .alert{max-width:none;margin:0}
}

/* Màn hình ngang (máy tính, máy tính bảng ngang, điện thoại xoay ngang): thanh bên và hai cột. */
@media (min-width:960px),(min-width:700px) and (max-height:560px){
  body{padding-left:92px}
  nav.tabs{left:0;right:auto;top:0;bottom:0;width:92px;border-top:0;border-right:1px solid var(--line);padding:16px 8px;display:flex;flex-direction:column;align-items:stretch}
  nav.tabs .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 14px}
  nav.tabs .brand img,nav.tabs .brand svg{width:44px;height:44px;border-radius:12px;display:block}
  nav.tabs .brand b{display:none;font-size:22px;font-weight:800;letter-spacing:-.03em}
  nav.tabs div[role="tablist"]{max-width:none;margin:0;display:flex;flex-direction:column;gap:6px}
  nav.tabs button{padding:10px 4px}
  #app{max-width:1240px;padding:32px 36px 48px;display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:32px;align-items:start}
  .col{display:block}
  .top{grid-column:1/-1}
  .col-main{grid-column:1;grid-row:2;min-width:0}
  .col-side{grid-column:2;grid-row:2;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;scrollbar-width:thin}
  .col-main #composer{margin-top:0}
  .col-side>:first-child{margin-top:0}
  #today-habits h2:first-child{margin-top:22px}
  .hrow{flex-direction:column;flex-wrap:nowrap}
  .hrow .hcard{width:auto}
  body:not([data-tab="today"]) #app{grid-template-columns:minmax(0,1fr)}
  body:not([data-tab="today"]) .col-side{display:none}
  .top h1{font-size:34px}
  .hrow2{max-width:none}
  .dl{max-width:none}
  /* Danh sách việc sắp tới và thói quen chia cột để tận dụng chiều ngang */
  #view-soon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;align-items:start}
  #view-soon>h2,#view-soon>.empty{grid-column:1/-1}
  #view-soon .task{margin-bottom:12px}
  #view-habits{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
  /* Lịch: tháng bên trái, chi tiết ngày bên phải */
  .calgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr);gap:28px;align-items:start}
  .calright .daypanel{margin-top:0;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
  .calnow{margin-top:0}
  .calh{margin-top:6px}
  .cd{aspect-ratio:1/.82}
}

/* Màn hình rộng: thanh bên đầy đủ có chữ. */
@media (min-width:1280px){
  body{padding-left:260px}
  nav.tabs{width:260px;padding:28px 18px}
  nav.tabs .brand{justify-content:flex-start;padding:0 8px;margin:0 0 22px}
  nav.tabs .brand b{display:block}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 16px;font-size:15px;border-radius:14px}
  #app{padding:40px 48px 56px;grid-template-columns:minmax(0,1fr) 380px;column-gap:40px}
}
@media (min-width:1700px){
  #app{max-width:1400px;grid-template-columns:minmax(0,1fr) 420px}
}

/* Điện thoại xoay ngang: thấp nên bỏ bớt khoảng đệm. */
@media (min-width:700px) and (max-height:560px){
  #app{padding:16px 20px 24px}
  .top h1{font-size:26px}
  .col-side{top:12px;max-height:calc(100vh - 24px)}
  .calright .daypanel,.calgrid{max-height:none}
}

/* Chuột và bàn phím: trạng thái di chuột và con trỏ tay. */
@media (hover:hover) and (pointer:fine){
  button{transition:background-color .12s,border-color .12s,box-shadow .12s,transform .12s,filter .12s}
  nav.tabs button:hover:not([aria-selected="true"]){background:var(--accent-soft);color:var(--accent-text)}
  .task:hover,.hcard:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow)}
  .qtile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(19,26,46,.14)}
  .sgrid button:hover,.cd:hover:not(.sel),.addt:hover,.tone:hover{border-color:var(--accent);background:var(--accent-soft)}
  .srow:hover,.ag:hover{background:var(--accent-soft)}
  .send:hover,.sbtns .pri:hover,.pri2:hover{filter:brightness(1.07)}
  .check:hover{border-color:var(--ok)}
  .icon-btn:hover,.avatar:hover{filter:brightness(.95)}
  .qs button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
}

#today-habits:empty{display:none}
@media (min-width:960px),(min-width:700px) and (max-height:560px){

<script>
/* Định lượng nguyên liệu: đọc "500g", "1,5 kg", "1/2 muỗng", tăng giảm theo bước hợp lý và co giãn theo số người ăn.
   Dùng được cả trong trình duyệt (window.RemiQty) lẫn Node (để test). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RemiQty = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const QTY_RE = /^\s*(\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?)\s*(.*)$/;

  /** "500g" -> {n: 500, u: "g"}; không bắt đầu bằng số (vd "một ít") -> null */
  function parseQty(s) {
    const m = QTY_RE.exec(String(s == null ? '' : s));
    if (!m) return null;
    let n;
    if (m[1].indexOf('/') >= 0) {
      const p = m[1].split('/');
      n = parseFloat(p[0]) / parseFloat(p[1]);
    } else {
      n = parseFloat(m[1].replace(',', '.'));
    }
    return isFinite(n) && n > 0 ? { n: n, u: m[2].trim() } : null;
  }

  function unitKind(u) {
    const x = String(u).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[.\s]/g, '');
    if (/^(g|gr|gram|grams)$/.test(x)) return 'g';
    if (/^(kg|kgs|kilogram|ky|ki)$/.test(x)) return 'kg';
    if (x === 'ml') return 'ml';
    if (/^(l|lit|litre|liter)$/.test(x)) return 'l';
    if (/^(muong|thia|tsp|tbsp)/.test(x)) return 'spoon';
    return 'count'; // củ, quả, cây, gói, hộp, bó, nhánh...
  }

  function fmtQ(n) {
    return String(Math.round(n * 100) / 100).replace('.', ',');
  }
  function qtyText(n, u) {
    return fmtQ(n) + (u ? ' ' + u : '');
  }

  function stepSize(n, kind) {
    if (kind === 'g') return n < 100 ? 10 : 50;
    if (kind === 'ml') return n < 200 ? 10 : 50;
    if (kind === 'kg' || kind === 'l') return n <= 1 ? 0.25 : 0.5;
    if (kind === 'spoon') return 0.5;
    return 1;
  }

  /** Ô trống hoặc đọc được thì chỉnh bằng nút +/- được; chữ tự do ("một ít") thì không. */
  function canStep(s) {
    return !String(s == null ? '' : s).trim() || !!parseQty(s);
  }

  /** Tăng (dir=1) hoặc giảm (dir=-1) một bước. Không bao giờ giảm xuống 0. */
  function stepQty(s, dir) {
    if (!String(s == null ? '' : s).trim()) return dir > 0 ? '1' : '';
    const q = parseQty(s);
    if (!q) return s;
    const n = q.n + dir * stepSize(q.n, unitKind(q.u));
    if (n <= 0.0001) return s;
    return qtyText(n, q.u);
  }

  /** Nhân định lượng với `ratio` (số người mới / số người cũ) rồi làm tròn theo từng loại đơn vị. */
  function scaleQty(s, ratio) {
    if (!ratio || ratio === 1) return s;
    const q = parseQty(s);
    if (!q) return s;
    const k = unitKind(q.u);
    const n = q.n * ratio;
    let r;
    if (k === 'g' || k === 'ml') r = n < 100 ? Math.round(n / 5) * 5 : Math.round(n / 10) * 10;
    else if (k === 'kg' || k === 'l') r = Math.round(n / 0.25) * 0.25;
    else if (k === 'spoon') r = Math.round(n / 0.5) * 0.5;
    else r = Math.round(n); // củ, quả, gói, hộp...: không mua được nửa gói nên làm tròn số nguyên
    if (r <= 0) r = k === 'g' || k === 'ml' ? 5 : k === 'kg' || k === 'l' ? 0.25 : k === 'spoon' ? 0.5 : 1;
    return qtyText(r, q.u);
  }

  return { parseQty: parseQty, unitKind: unitKind, stepQty: stepQty, scaleQty: scaleQty, canStep: canStep, fmtQ: fmtQ };
});

        if (!m) return null;
        spans.push([m.index, m.index + m[0].length]);
        g = g.slice(0, m.index) + ' '.repeat(m[0].length) + g.slice(m.index + m[0].length);
        return m;
      };

      /* nhắc trước */
      let lead = null;
      const lm = take(/(?:(?:nhac|bao|nhac nho)\s*(?:toi|tui|minh|em|giup)?\s*)?truoc\s*(?:toi|tui|minh|em)?\s*(\d+(?:[.,]\d+)?)\s*(phut|p|tieng|gio|h)\b(\s*ruoi)?/);
      if (lm) {
        const n = parseFloat(lm[1].replace(',', '.'));
        lead = Math.round(/^(phut|p)$/.test(lm[2]) ? n : n * 60) + (lm[3] ? 30 : 0);
      }

      /* số người ăn */
      let servings = 4;
      const sm = take(/\bcho\s*(\d{1,2})\s*nguoi\b/);
      if (sm) servings = Math.max(1, Math.min(20, +sm[1]));

      /* lặp lại */
      let repeat = 'none', recurring = false, repeatPod = null, weeklyWd = null;
      let m;
      if ((m = take(/\b(?:moi|hang)\s*ngay\b|\bngay nao cung\b/))) { repeat = 'daily'; recurring = true; }
      else if ((m = take(/\bmoi\s+(sang|trua|chieu|toi|dem)\b/))) { repeat = 'daily'; recurring = true; repeatPod = m[1]; }
      else if ((m = take(/\bmoi\s+thu\s+(hai|ba|tu|nam|sau|bay|[2-7])\b/))) { repeat = 'weekly'; recurring = true; weeklyWd = WD_WORD[m[1]]; }
      else if ((m = take(/\bmoi\s+(?:chu nhat|cn)\b/))) { repeat = 'weekly'; recurring = true; weeklyWd = 0; }
      else if ((m = take(/\b(?:moi|hang)\s*tuan\b/))) { repeat = 'weekly'; recurring = true; }

      /* danh sách ngày trong tuần của thói quen: "thứ 2, 4, 6", "cuối tuần", "ngày thường" */
      let days = null;
      const dl = /\bthu\s*([2-7])((?:\s*(?:,|;|va|-|\/)\s*(?:thu\s*)?[2-7])+)\b/.exec(g);
      if (dl) {
        days = (dl[1] + dl[2]).match(/[2-7]/g).map((x) => WD_WORD[x]);
        spans.push([dl.index, dl.index + dl[0].length]);
        g = g.slice(0, dl.index) + ' '.repeat(dl[0].length) + g.slice(dl.index + dl[0].length);
        recurring = true;
      } else if (take(/\bcuoi tuan\b/)) { days = [6, 0]; recurring = true; }
      else if (take(/\bngay thuong\b/)) { days = [1, 2, 3, 4, 5]; recurring = true; }

      /* giờ tương đối: "sau 20 phút", "2 tiếng nữa" */
      let relative = null;
      // "thứ 2 tuần sau 11 giờ" và "thứ sáu 4 giờ" không phải "sau 11 giờ": che chữ "sau" của "tuần sau" và "thứ sáu" khi tìm giờ tương đối
      const gr = g.replace(/((?:tuan|thu)\s+)sau/g, (m, a) => a + '###');
      const rm = /\bsau\s*(\d+(?:[.,]\d+)?)\s*(phut|tieng|gio)(\s*ruoi)?\b/.exec(gr) || /\b(\d+(?:[.,]\d+)?)\s*(phut|tieng|gio)(\s*ruoi)?\s*nua\b/.exec(gr);
      if (rm) {
        spans.push([rm.index, rm.index + rm[0].length]);
        g = g.slice(0, rm.index) + ' '.repeat(rm[0].length) + g.slice(rm.index + rm[0].length);
        const n = parseFloat(rm[1].replace(',', '.'));
        relative = Math.round(rm[2] === 'phut' ? n : n * 60) + (rm[3] ? 30 : 0);
      }

      /* giờ */
      let time = null;
      const TIME_RE = /(?:luc\s*)?(?:(sang|trua|chieu|toi|dem)\s+)?(\d{1,2})\s*(?:h|:|gio)\s*(\d{1,2})?(?:\s*(sang|trua|chieu|toi|dem)\b)?/g;
      let tm;
      while (!relative && (tm = TIME_RE.exec(g))) {
        const before = g[tm.index - 1];
        if (before && /[\d:/]/.test(before)) continue;
        const h = +tm[2], mi = tm[3] === undefined ? 0 : +tm[3];
        if (h > 24 || mi > 59) continue;
        time = { h, mi, pod: tm[4] || tm[1] || null };
        spans.push([tm.index, tm.index + tm[0].length]);
        g = g.slice(0, tm.index) + ' '.repeat(tm[0].length) + g.slice(tm.index + tm[0].length);
        break;
      }

      /* ngày */
      let date = null, dayPod = null, explicitToday = false;
      const today = midnight(now);
      let dm;
      if ((dm = take(/\bngay kia\b/))) date = addDays(today, 2);
      else if ((dm = take(/\b(?:(sang|trua|chieu|toi|dem)\s+)?(?:ngay\s+)?mai\b/))) { date = addDays(today, 1); dayPod = dm[1] || null; }
      else if ((dm = take(/\b(?:hom nay|(sang|trua|chieu|toi|dem)\s+nay)\b/))) { date = today; dayPod = dm[1] || null; explicitToday = true; }
      else if ((dm = take(/\b(?:vao\s+)?(?:thu\s+(hai|ba|tu|nam|sau|bay|[2-7])|chu nhat|cn)\b(?:\s*(tuan sau|tuan toi|tuan nay|nay))?/))) {
        const wd = dm[1] === undefined ? 0 : WD_WORD[dm[1]];
        date = nextWeekday(today, wd, dm[2] && /sau|toi/.test(dm[2]));
      } else if ((dm = take(/\bngay\s+(\d{1,2})(?:\s*[\/-]\s*(\d{1,2}))?\b/))) {
        const d = +dm[1];
        const mo = dm[2] ? +dm[2] - 1 : now.getMonth();
        let cand = new Date(now.getFullYear(), mo, d);
        if (cand < today) cand = dm[2] ? new Date(now.getFullYear() + 1, mo, d) : new Date(now.getFullYear(), mo + 1, d);
        date = cand;
      }
      if (!date && weeklyWd !== null) date = nextWeekday(today, weeklyWd, false);

      /* phân loại */
      const water = /\buong\s+(?:du\s+)?(?:\d+(?:[.,]\d+)?\s*(?:lit|l|ml)\s+)?nuoc\b/.test(f);
      let verb = null;
      for (const v of HABIT_VERBS) if (new RegExp('\\b' + v[0] + '\\b').test(f)) { verb = v; break; }
      if (water) verb = HABIT_VERBS[0];
      const isHabit = water || (verb && recurring);

      let dish = null, dishSurface = '';
      if (!isHabit) {
        for (const di of dishIndex) {
          for (const k of di.keys) {
            const i = f.indexOf(k);
            if (i >= 0 && (!dish || k.length > dish.k.length)) dish = { d: di.d, k, i };
          }
        }
        if (dish) dishSurface = orig.slice(dish.i, dish.i + dish.k.length);
      }
      const shopping = !isHabit && (/\b(?:di cho|di sieu thi|mua sam|di mua|mua)\b/.test(f) || (/\bnau\b/.test(f) && !!dish));

      const out = {
        intent: isHabit ? 'habit' : 'task', title: '', emoji: '📌', when: null, repeat: 'none', leadMinutes: 0,
        shopping: false, servings: 4, assumption: '', summary: '', checklist: [], tips: [], habit: null,
      };

      if (isHabit) {
        const pod = time ? (time.pod) : repeatPod;
        let times = ['07:00'];
        if (time) times = [pad(hour24(time.h, pod, false) % 24) + ':' + pad(time.mi)];
        else if (repeatPod) times = [POD_DEFAULT_TIME[repeatPod]];
        out.habit = { recurring, times, days: days || [0, 1, 2, 3, 4, 5, 6], spread: null };
        if (water) {
          const lm2 = /(\d+(?:[.,]\d+)?)\s*(lit|l|ml)\b/.exec(f);
          const cm = /\bchia\s*(?:lam|thanh|ra)?\s*(\d{1,2})\s*(?:lan|cu|buoi|dot)\b/.exec(f);
          let ml = null;
          if (lm2) { const n = parseFloat(lm2[1].replace(',', '.')); ml = lm2[2] === 'ml' ? n : n * 1000; }
          let count = cm ? Math.max(1, Math.min(20, +cm[1])) : null;
          if (ml === null) ml = count ? count * 250 : 2000;      // không nói tổng lượng: mỗi lần 250 ml
          if (!count) count = Math.max(1, Math.ceil(ml / 250));
          let from = null, to = 'bed';
          // khoảng giờ rõ ràng: "từ 1h-5h", "8h đến 9h tối". Giờ bắt đầu theo quy tắc giờ trần; chỉ "sáng" ở cuối mới kéo giờ đầu về buổi sáng.
          const wm = /\b(\d{1,2})\s*(?:h|gio)?\s*(\d{2})?\s*(?:-|den)\s*(\d{1,2})\s*(?:h|gio)\s*(\d{2})?\s*(sang|trua|chieu|toi)?/.exec(f);
          if (wm) {
            const sH = +wm[1], eH = +wm[3], ePod = wm[5] || null;
            let s24 = ePod === 'sang' ? (sH === 12 ? 0 : sH) : hour24(sH, null, false);
            let e24 = hour24(eH, ePod, false) % 24;
            if (e24 <= s24 && !ePod && e24 + 12 < 24) e24 += 12;
            from = pad(s24) + ':' + pad(wm[2] ? +wm[2] : 0);
            to = pad(e24) + ':' + pad(wm[4] ? +wm[4] : 0);
          } else {
            const tt = /\bden\s*(\d{1,2})\s*(?:h|gio)\s*(\d{2})?\s*(sang|trua|chieu|toi)?/.exec(f);
            if (tt) {
              let h = +tt[1];
              if (h < 12 && (tt[3] === 'toi' || tt[3] === 'chieu' || !tt[3])) h += 12;
              to = pad(h % 24) + ':' + pad(tt[2] ? +tt[2] : 0);
            }
          }
          const fromNow = /\b(tu bay gio|tu day|bay gio)\b/.test(f);
          out.habit.times = [];
          out.habit.ml = ml;
          out.habit.spread = { count, from: from || (fromNow || !recurring ? 'now' : 'wake'), to };
        }
        const label = verb ? verb[1] : 'Thói quen';
        let extra = '';
        if (water) {
          const lm3 = /(\d+(?:[.,]\d+)?)\s*(lit|l)\b/.exec(f);
          if (lm3) extra = ' ' + lm3[1].replace('.', ',') + ' lít';
        } else {
          const qm = /(\d+)\s*(phut|trang|buoc|km|cai|lan)\b/.exec(f);
          if (qm) extra = ' ' + qm[1] + ' ' + UNIT_VN[qm[2]];
        }
        out.title = label + extra;
        out.emoji = verb ? verb[2] : '🎯';
        return out;
      }

      /* việc thường */
      const shoppingCtx = shopping;
      let when;
      if (relative !== null) {
        when = new Date(now.getTime() + relative * 60000);
      } else if (time) {
        const pod = time.pod || dayPod || repeatPod;
        const h = hour24(time.h, pod, shoppingCtx);
        when = new Date((date || today).getFullYear(), (date || today).getMonth(), (date || today).getDate(), h % 24, time.mi);
        if (!date && when <= now) when = addDays(when, 1);
      } else {
        const base = date || addDays(today, now.getHours() >= 9 ? 1 : 0);
        when = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 9, 0);
      }
      out.when = iso(when);
      out.repeat = repeat;
      out.leadMinutes = lead !== null ? lead : (shopping ? 60 : 0);
      out.shopping = shopping;

      if (shopping) {
        out.servings = servings;
        out.emoji = '🛒';
        if (dish) {
          out.title = 'Đi chợ nấu ' + dishSurface;
          const base = dish.d.servings || 4;
          out.checklist = dish.d.items.map((x) => ({ item: x.item, qty: Q.scaleQty(x.qty, servings / base) }));
        }
      }
      if (!out.title) out.title = cleanTitle(orig, f, spans);
      return out;
    }
    return { parse };
  }

  function nextWeekday(today, wd, nextWeek) {
    if (nextWeek) {
      const dow = today.getDay();
      const nextMon = addDays(today, (8 - dow) % 7 || 7);
      return addDays(nextMon, wd === 0 ? 6 : wd - 1);
    }
    let diff = (wd - today.getDay() + 7) % 7;
    if (diff === 0) diff = 7;
    return addDays(today, diff);
  }

  const FILLER_RE = /^(?:nhac nho|nhac|nho|dung quen)\s*(?:toi|tui|minh|em|giup)?\s*(?:(?:la|phai)\s*)?/;
  const TRAIL = new Set(['nha', 'nhé', 'nhen', 'nhỉ', 'nhá']); // so khớp trên chữ gốc có dấu, để "nhà" không bị coi là "nha"
  function cleanTitle(orig, f, spans) {
    const keep = [];
    spans.sort((a, b) => a[0] - b[0]);
    let pos = 0;
    for (const [s, e] of spans) { if (s > pos) keep.push(orig.slice(pos, s)); pos = Math.max(pos, e); }
    keep.push(orig.slice(pos));
    let t = keep.join(' ').replace(/\s+/g, ' ').trim();
    const ft = fold(t), fm = FILLER_RE.exec(ft);
    if (fm && fm[0].length) t = t.slice(fm[0].length).trim();
    t = t.replace(/^[\s,.;:-]+|[\s,.;:-]+$/g, '');
    let toks = t.split(' ').filter((x) => !['luc', 'vao'].includes(fold(x)));
    while (toks.length > 1 && TRAIL.has(toks[toks.length - 1].replace(/[.,!]+$/, '').toLowerCase())) toks.pop();
    t = toks.join(' ').replace(/^[\s,.;:-]+|[\s,.;:-]+$/g, '');
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Việc mới';
  }

  return { createParser, fold };
});

</script>
<script>
(function(){
'use strict';
const {parseQty,stepQty,scaleQty,canStep}=window.RemiQty;
const LP=window.RemiLocalParse.createParser(window.REMI_DISHES||[]);

/* ---------- helpers ---------- */
const WD=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const WDS=['CN','T2','T3','T4','T5','T6','T7'];
const pad=n=>String(n).padStart(2,'0');
const dKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toLocal=d=>dKey(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmtNum=n=>Number(n).toLocaleString('vi-VN');
const leadText=m=>(m>=60&&m%60===0)?(m/60)+' tiếng':m+' phút';
const REPEAT={none:'',daily:'Hằng ngày',weekly:'Hằng tuần'};

function dayLabel(d){
  const t=new Date(), k=dKey(d);
  if(k===dKey(t)) return 'Hôm nay';
  const n=new Date(t); n.setDate(n.getDate()+1);
  if(k===dKey(n)) return 'Ngày mai';
  return WDS[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1);
}

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const state={
  tasks:store.get('nhip.tasks',[]),
  habits:store.get('nhip.habits',[]),
  fired:store.get('nhip.fired',{}),
  profile:store.get('nhip.profile',null),
  sleep:store.get('nhip.sleep',null),
  greeted:store.get('nhip.greeted',''),
  pantry:store.get('nhip.pantry',{}),
  dishes:store.get('nhip.dishes',{}),
  dayNotes:store.get('nhip.daynotes',{})
};
if(!Array.isArray(state.tasks)) state.tasks=[];
if(!Array.isArray(state.habits)) state.habits=[];
if(!state.pantry||typeof state.pantry!=='object'||Array.isArray(state.pantry))state.pantry={};
if(!state.dishes||typeof state.dishes!=='object'||Array.isArray(state.dishes))state.dishes={};
if(!state.dayNotes||typeof state.dayNotes!=='object'||Array.isArray(state.dayNotes))state.dayNotes={};
function sleepDayKey(){return dKey(new Date(Date.now()-4*3600000))}
if(!state.sleep||typeof state.sleep!=='object'){const hr0=new Date().getHours();state.sleep={day:sleepDayKey(),awake:hr0>=6&&hr0<23,wakeAt:null}}
state.habits.forEach(h=>{
  if(!h.log)h.log={};
  if(h.unit!==undefined||h.goal!==undefined){
    const st=h.step||1;
    Object.keys(h.log).forEach(k=>{h.log[k]=Math.round((h.log[k]||0)/st)});
    delete h.unit;delete h.goal;delete h.step;
  }
  if(!Array.isArray(h.days)||!h.days.length)h.days=[0,1,2,3,4,5,6];
  if(!Array.isArray(h.times)||!h.times.length)h.times=['07:00'];
});
if(!state.fired||typeof state.fired!=='object') state.fired={};
function save(){
  const keys=Object.keys(state.fired);
  if(keys.length>400){keys.slice(0,keys.length-300).forEach(k=>delete state.fired[k])}
  store.set('nhip.tasks',state.tasks);store.set('nhip.habits',state.habits);store.set('nhip.fired',state.fired);store.set('nhip.profile',state.profile);store.set('nhip.sleep',state.sleep);store.set('nhip.greeted',state.greeted);store.set('nhip.pantry',state.pantry);store.set('nhip.dishes',state.dishes);store.set('nhip.daynotes',state.dayNotes);
}
let tab='today';
const openIds=new Set();

/* ---------- sleep, wake & day window ---------- */
const WAKE_BUF=30;
const toMin=t=>{const a=String(t).split(':');return (+a[0])*60+(+a[1])};
const fromMin=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
function profileWake(){return (state.profile&&state.profile.wake)||'06:30'}
function profileBed(){return (state.profile&&state.profile.bed)||'22:30'}
function wakeStart(){return (state.sleep.awake&&state.sleep.wakeAt)?hm(new Date(state.sleep.wakeAt)):profileWake()}
function windowTimes(count,fromM,toM){
  if(count<=1||toM<=fromM)return [fromMin(fromM)];
  const step=(toM-fromM)/(count-1),out=[];
  for(let i=0;i<count;i++){const t=fromMin(Math.min(1435,Math.round((fromM+i*step)/5)*5));if(out.indexOf(t)<0)out.push(t)}
  return out;
}
function calcSpread(sp){
  const ex=/^\d{2}:\d{2}$/;
  if(ex.test(sp.from)&&ex.test(sp.to))return windowTimes(Math.max(1,sp.count),toMin(sp.from),toMin(sp.to));   // "từ 1h-5h chia 4 lần": giờ đầu và giờ cuối đều có nhắc
  const now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  let start;
  if(sp.from==='now')start=nowM;
  else if(sp.from==='wake')start=Math.max(toMin(wakeStart()),nowM);
  else start=toMin(sp.from);
  const end=Math.min(1435,sp.to==='bed'?toMin(profileBed()):toMin(sp.to));
  if(end<=start+20)return [fromMin(Math.min(1435,start+5))];
  const n=Math.max(1,sp.count),step=(end-start)/n;
  const out=[];
  for(let i=0;i<n;i++){const m=Math.round((start+(i+0.5)*step)/5)*5;const t=fromMin(Math.min(1435,m));if(out.indexOf(t)<0)out.push(t)}
  return out;
}
function hTimes(h){return (h.spread&&h.plan&&h.plan.day===sleepDayKey())?h.plan.times:h.times}
function habitActive(h,d){return h.once?h.date===dKey(d):h.days.indexOf(d.getDay())>=0}
function wakePlan(){
  const now=new Date();
  const c=state.tasks.filter(t=>!t.done&&t.when).map(t=>({t:t,d:new Date(t.when)}))
    .filter(x=>x.d>now&&x.d-now<24*3600000&&x.d.getHours()<12).sort((a,b)=>a.d-b.d)[0];
  if(!c)return null;
  const call=new Date(c.d.getTime()-WAKE_BUF*60000);
  return {task:c.t,title:c.t.title,due:c.d,call:call,callStr:hm(call),timeStr:hm(c.d)};
}
function setAwake(v){
  const now=new Date();
  state.sleep.day=sleepDayKey();
  if(v){
    if(state.sleep.awake&&state.sleep.wakeAt)return;
    state.sleep.awake=true;state.sleep.wakeAt=toLocal(now);
    state.habits.forEach(h=>{if(h.spread)h.plan=null});
    save();tick();render();
    const n=state.tasks.filter(t=>!t.done&&t.when&&dKey(new Date(t.when))===dKey(now)&&new Date(t.when)>now).length;
    const hasSpread=state.habits.some(h=>h.spread&&habitActive(h,now));
    if(state.greeted!==sleepDayKey()){
      state.greeted=sleepDayKey();save();
      alertUser('☀️',greetWord()+', '+(nm()||'bạn'),(n?'Hôm nay còn '+n+' việc. ':'')+(hasSpread?'Giờ uống nước đã chia lại từ '+hm(now)+'.':'Chúc bạn một ngày nhiều năng lượng.'));
    }
  }else{
    state.sleep.awake=false;state.sleep.wakeAt=null;
    save();render();
    const wp=wakePlan();
    alertUser('😴','Ngủ ngon, '+(nm()||'bạn'),wp?'Mai gọi dậy lúc '+wp.callStr+' vì '+wp.timeStr+' có '+wp.title.charAt(0).toLowerCase()+wp.title.slice(1)+'.':'Không có việc buổi sáng, bạn ngủ thoải mái nhé.');
  }
}
const lc=x=>x.charAt(0).toLowerCase()+x.slice(1);
function greetWord(){const hr=new Date().getHours();return hr<11?'Chào buổi sáng':hr<14?'Chào buổi trưa':hr<18?'Chào buổi chiều':'Chào buổi tối'}
function nearBed(){const d=new Date(),m=d.getHours()*60+d.getMinutes();return m>=toMin(profileBed())-60||m<240}
function renderSleep(){
  const aw=state.sleep.awake,tr=$('#sl-track');
  tr.classList.toggle('on',aw);
  tr.setAttribute('aria-checked',String(aw));
  $('#sl-thumb').textContent=aw?'☀️':'😴';
  const wp=wakePlan();
  const plan=wp?((dKey(wp.due)===dKey(new Date())?'Sáng nay':'Sáng mai')+' gọi dậy lúc '+wp.callStr+' vì '+wp.timeStr+' có '+lc(wp.title)+'.'):'';

(function(){
  const track=document.getElementById('sl-track'),thumb=document.getElementById('sl-thumb');
  let drag=null;
  const W=()=>track.clientWidth-52;
  track.addEventListener('pointerdown',e=>{drag={x:e.clientX,moved:false,start:state.sleep.awake,pos:state.sleep.awake?W():0};try{track.setPointerCapture(e.pointerId)}catch(err){}track.classList.add('drag')});
  track.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x;if(Math.abs(dx)>4)drag.moved=true;
    drag.pos=Math.max(0,Math.min(W(),(drag.start?W():0)+dx));
    thumb.style.left=(drag.pos+4)+'px';
  });
  const end=cancel=>{
    if(!drag)return;
    const d=drag;drag=null;track.classList.remove('drag');thumb.style.left='';
    if(cancel){renderSleep();return}
    const want=d.moved?(d.pos>W()/2):!d.start;
    if(want!==state.sleep.awake||(want&&!state.sleep.wakeAt))setAwake(want);else renderSleep();
  };
  track.addEventListener('pointerup',()=>end(false));
  track.addEventListener('pointercancel',()=>end(true));
  track.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setAwake(!state.sleep.awake)}});
})();

function dishKey(t){const r=String(t).toLowerCase().replace(/^(đi chợ|đi siêu thị|đi mua|mua sắm|mua)\s*/,'').trim();return r||String(t).toLowerCase().trim()}
function findDish(title){
  const k=dishKey(title);if(!k)return null;
  let best=null,bl=0;
  Object.keys(state.dishes).forEach(d=>{if(d.length>=3&&(d===k||k.indexOf(d)>=0||d.indexOf(k)>=0)&&d.length>bl){best=d;bl=d.length}});
  return best?state.dishes[best]:null;
}
/** Món đã nhớ: bản cũ là mảng, bản mới là {s: số người, items: [...]}. */
function dishRecord(v){
  if(!v)return null;
  if(Array.isArray(v))return {s:0,items:v};
  return {s:v.s||0,items:Array.isArray(v.items)?v.items:[]};
}
function saveDish(title,list,servings){
  const items=(list||[]).map(c=>({item:c.item,qty:c.qty||''}));
  if(items.length)state.dishes[dishKey(title)]={s:servings||0,items:items};
}
function pantryAdd(name){const k=String(name).trim().toLowerCase();if(!k)return;const e=state.pantry[k]||{name:String(name).trim(),n:0};e.n++;state.pantry[k]=e}

/* ---------- scheduler ---------- */
function advance(t){
  const step=t.repeat==='weekly'?7:1;
  const d=new Date(t.when),now=new Date();
  do{d.setDate(d.getDate()+step)}while(d<=now);
  t.when=toLocal(d);
  (t.checklist||[]).forEach(c=>c.done=false);
}
function tick(){
  const now=new Date();let changed=false;
  const sdk=sleepDayKey();
  if(state.sleep.day!==sdk){
    state.sleep={day:sdk,awake:now.getHours()>=9&&now.getHours()<23,wakeAt:null};
    state.habits.forEach(h=>{h.plan=null});changed=true;
  }
  const nh=state.habits.length;
  state.habits=state.habits.filter(h=>!h.once||h.date>=dKey(now));
  if(state.habits.length!==nh)changed=true;
  state.habits.forEach(h=>{if(h.spread&&(!h.plan||h.plan.day!==sdk)){h.plan={day:sdk,times:calcSpread(h.spread)};changed=true}});
  if(!state.sleep.awake){
    const wp=wakePlan();
    if(wp){
      const k1=wp.task.id+':'+wp.task.when+':wake',k2=wp.task.id+':'+wp.task.when+':wake2';
      if(now>=wp.call&&!state.fired[k1]){
        state.fired[k1]=1;changed=true;
        alertUser('⏰',phrase('wake',wp.title,leadText(Math.max(1,Math.round((wp.due-now)/60000)))),'Lúc '+hm(wp.due)+' bạn có việc.',{label:'Tôi dậy rồi',fn:()=>setAwake(true)});
      }else if(state.fired[k1]&&!state.fired[k2]&&now>=new Date(wp.due.getTime()-10*60000)){
        state.fired[k2]=1;changed=true;
        alertUser('⏰',phrase('wake2',wp.title,'10 phút'),'Bạn vẫn đang ở chế độ ngủ.',{label:'Tôi dậy rồi',fn:()=>setAwake(true)});
      }
    }
  }
  state.tasks.forEach(t=>{
    if(t.done||!t.when)return;
    const due=new Date(t.when);
    const lead=new Date(due.getTime()-(t.leadMin||0)*60000);
    const kl=t.id+':'+t.when+':lead',kd=t.id+':'+t.when+':due';
    if(t.leadMin>0&&now>=lead&&now<due&&!state.fired[kl]){
      state.fired[kl]=1;changed=true;
      const mins=Math.max(1,Math.round((due-now)/60000));
      const n=(t.checklist||[]).length;
      alertUser(t.emoji,phrase('lead',t.title,leadText(mins)),(n?n+' mục cần chuẩn bị, mở thẻ để xem':'Lúc '+hm(due)));
    }
    if(now>=due&&!state.fired[kd]){
      state.fired[kd]=1;changed=true;
      if(now-due<2*3600000) alertUser(t.emoji,phrase('due',t.title),'Lúc '+hm(due),{label:'Đã xong',fn:()=>completeTask(t.id)});
      if(t.repeat!=='none'){advance(t)}
    }
  });
  state.habits.forEach(h=>{
    if(!habitActive(h,now))return;
    const ts=hTimes(h),goal=ts.length,today=Math.min(goal,h.log[dKey(now)]||0);
    if(today>=goal)return;
    ts.forEach(tm=>{
      const [H,M]=tm.split(':').map(Number);
      const at=new Date(now);at.setHours(H,M,0,0);
      const k=h.id+':'+dKey(now)+':'+tm;
      if(now>=at&&now-at<30*60000&&!state.fired[k]){
        state.fired[k]=1;changed=true;
        alertUser(h.emoji,phrase('due',h.title),h.portionMl?'Uống '+h.portionMl+' ml ('+(today*h.portionMl)+'/'+(goal*h.portionMl)+' ml hôm nay)':(goal>1?'Hôm nay '+today+'/'+goal+' lần':'Lúc '+tm),{label:h.portionMl?'Đã uống':'Xong',fn:()=>addHabit(h.id,1)});
      }
    });
  });
  if(changed){save();render()}
}

/* ---------- actions ---------- */
function completeTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  if(t.repeat!=='none'&&t.when){advance(t)}else{t.done=!t.done}
  save();render();
}
function addHabit(id,amt){
  const h=state.habits.find(x=>x.id===id);if(!h)return;
  const k=dKey(new Date());
  h.log[k]=Math.max(0,Math.min(hTimes(h).length,(h.log[k]||0)+amt));
  save();render();
}

function extractJSON(t){
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('no json');
  return JSON.parse(t.slice(a,b+1));
}
function defaultWhen(){const d=new Date();d.setHours(d.getHours()+1,0,0,0);return d}
function normalize(r,text){
  r=r||{};
  const intent=(r.intent==='habit'&&r.habit)?'habit':'task';
  const out={
    intent,title:String(r.title||text).slice(0,80),
    emoji:r.emoji||(intent==='habit'?'🎯':'📌'),
    assumption:r.assumption?String(r.assumption).slice(0,60):'',
    summary:r.summary?String(r.summary).slice(0,90):'',
    checklist:Array.isArray(r.checklist)?r.checklist.slice(0,16).map(c=>({item:String((c&&c.item)||c),qty:String((c&&c.qty)||''),done:false})):[],
    tips:Array.isArray(r.tips)?r.tips.slice(0,2).map(t=>String(t).slice(0,70)):[]
  };
  if(intent==='habit'){
    const h=r.habit;
    const rec=!!h.recurring;
    const times=(Array.isArray(h.times)?h.times:[]).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,'0'));
    const days=(Array.isArray(h.days)?h.days:[]).map(Number).filter(d=>d>=0&&d<=6);
    const fix=x=>/^\d{1,2}:\d{2}$/.test(String(x))?String(x).padStart(5,'0'):String(x);
    let sp=null;
    if(h.spread&&Number(h.spread.count)>0){
      const f=fix(h.spread.from),t=fix(h.spread.to);
      sp={count:Math.min(20,Math.round(Number(h.spread.count))),from:/^(now|wake|\d{2}:\d{2})$/.test(f)?f:(rec?'wake':'now'),to:/^(bed|\d{2}:\d{2})$/.test(t)?t:'bed'};
    }
    let tms=times;
    const sp0=sp?Object.assign({},sp):null;
    if(sp){tms=calcSpread(sp);if(!rec)sp=null}
    let ml=Number(h.ml);
    if(!(ml>=100&&ml<=10000)){
      ml=null;
      const mm=/(\d+(?:[.,]\d+)?)\s*(lít|lit|l|ml)\b/i.exec(String(r.title||text));
      if(mm){const n=parseFloat(mm[1].replace(',','.'));ml=/^ml$/i.test(mm[2])?n:n*1000}
    }
    out.habit={recurring:rec,times:tms.length?tms:['07:00'],days:days.length?Array.from(new Set(days)).sort():[0,1,2,3,4,5,6],spread:sp,waterSpec:sp0,ml:ml?Math.round(ml):null};
  }else{
    let d=r.when?new Date(r.when):null;if(d&&isNaN(d))d=null;
    out.when=toLocal(d||defaultWhen());
    out.leadMin=Math.max(0,Math.min(1440,parseInt(r.leadMinutes,10)||0));
    out.repeat=(r.repeat==='daily'||r.repeat==='weekly')?r.repeat:'none';
    out.shopping=(r.shopping!==undefined&&r.shopping!==null)?!!r.shopping:/chợ|siêu thị|mua sắm|đi mua|nấu/i.test(out.title);
    out.servings=Math.max(1,Math.min(20,parseInt(r.servings,10)||4));
  }
  return out;
}

  if(/rate|limit|quota/i.test(t))return 'Hôm nay AI đã hết lượt, thử lại sau nhé.';

function shouldSmart(t){

  const m=t.match(/\d{1,2}\s*(?:h|giờ|:)\s*\d{0,2}/gi);
  return !!(m&&m.length>=2);
}
function shopTimeFor(cookH,cookM){
  const now=new Date(),d=new Date();
  d.setHours(cookH,cookM,0,0);d.setMinutes(d.getMinutes()-120);
  if(d<new Date(now.getTime()+30*60000)){
    const e=new Date(now.getTime()+30*60000);e.setMinutes(Math.ceil(e.getMinutes()/15)*15,0,0);
    const lim=new Date();lim.setHours(cookH,cookM,0,0);
    if(e<lim)return e;
    const n=new Date();n.setDate(n.getDate()+1);n.setHours(16,30,0,0);return n;
  }
  return d;
}

async function askClaudeContent(key,content,maxTok){
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:AI_MODEL,max_tokens:maxTok||1800,messages:[{role:'user',content:content}]})});
  }catch(e){throw {code:'network',message:'Không kết nối được AI'}}
  if(!r.ok)throw {code:'http_'+r.status,message:'AI trả về lỗi '+r.status};
  const j=await r.json();
  return extractJSON((j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''));
}
function readImage(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const max=1280,k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('img'))};
    img.src=url;
  });
}

function bindStepper(id,value,onChange){
  const root=document.getElementById(id);
  const hh=root.querySelector('[data-k="h"]'),mm=root.querySelector('[data-k="m"]'),word=root.querySelector('[data-w]');
  let cur=toMin(/^\d{1,2}:\d{2}$/.test(value)?value:'07:00');
  const show=()=>{hh.value=pad(Math.floor(cur/60));mm.value=pad(cur%60);word.textContent=timeWord(fromMin(cur))};
  const set=(m,fire)=>{cur=((m%1440)+1440)%1440;show();if(fire!==false&&onChange)onChange(fromMin(cur))};
  root.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)set(cur+Number(b.dataset.d))});

  [hh,mm].forEach(i=>{i.addEventListener('change',fromInputs);i.addEventListener('focus',()=>i.select())});

async function askDirect(key,prompt){
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:1200,messages:[{role:'user',content:prompt}]})});
  }catch(e){throw {code:'network',message:'Không kết nối được AI'}}
  if(!r.ok)throw {code:'http_'+r.status,message:'AI trả về lỗi '+r.status};
  const j=await r.json();
  return extractJSON((j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''));
}
async function understand(text){
  const mode=store.get('nhip.aimode','auto');
  let why='';
  if(mode!=='local'){
    try{
      const sample=window.claude?await getSample():null;
      if(sample){const res=await sample(buildPrompt(text),{cache:false,modelTier:'quick'});return {data:extractJSON(res.text),engine:'claude'}}
    }catch(e){why=aiHelp(e)}
    const key=store.get('nhip.aikey','');
    if(key){
      try{return {data:await askDirect(key,buildPrompt(text)),engine:'claude'}}catch(e){why=aiHelp(e)}
    }
  }
  return {data:LP.parse(text,toLocal(new Date())),engine:'local',why:why};
}

function shopItems(p){
  const out=[],seen={},cat={};
  CATALOG.forEach(g=>g[1].forEach(n=>{cat[norm(n)]=1}));
  const add=(item,qty,group,on)=>{const k=norm(String(item).trim());if(!k||seen[k])return;seen[k]=1;out.push({item:String(item).trim(),qty:qty||'',group:group,on:!!on})};
  const rec=dishRecord(findDish(p.title)),base=p.servings||4;
  if(rec)rec.items.forEach(x=>add(x.item,scaleQty(x.qty,rec.s?base/rec.s:1),MY_GROUPS[0],p.preselect&&!p.checklist.length));
  p.checklist.forEach(c=>add(c.item,c.qty,MY_GROUPS[1],p.preselect));
  Object.keys(state.pantry).map(k=>state.pantry[k]).sort((a,b)=>b.n-a.n).forEach(e=>{if(!cat[norm(e.name)])add(e.name,'',MY_GROUPS[2])});
  CATALOG.forEach(g=>g[1].forEach(n=>add(n,'',g[0])));
  return out;

function initShop(){
  const q=$('#sh-q'),list=$('#sh-list');
  const r=()=>{
    const on=shop.items.filter(x=>x.on);
    $('#sh-n').textContent=on.length?on.length+' món':'';
    $('#sh-sel').innerHTML=on.length?on.map(x=>qrowHtml(shop.items.indexOf(x),x.item,x.qty)).join(''):'<p class="dhint" style="margin:6px 0 0">Chưa có món nào. Chạm dấu + ở bên dưới để thêm.</p>';
    const raw=q.value.trim(),nq=norm(raw);
    const exact=shop.items.some(x=>norm(x.item)===nq);
    let html='';
    if(raw&&!exact)html+='<button type="button" class="srow new" data-add="1"><span class="plus">+</span><span class="sname">Thêm “'+esc(raw)+'” vào danh sách</span></button>';
    let last='',n=0;
    shop.items.forEach((x,i)=>{
      if(nq&&norm(x.item).indexOf(nq)<0)return;
      n++;
      if(x.group!==last){html+='<div class="shead">'+esc(x.group)+'</div>';last=x.group}
      html+='<button type="button" class="srow'+(x.on?' on':'')+'" data-i="'+i+'"><span class="plus">'+(x.on?'✓':'+')+'</span><span class="sname">'+esc(x.item)+'</span>'+(x.qty?'<span class="sqty">'+esc(x.qty)+'</span>':'')+'</button>';
    });
    if(!html)html='<p class="dhint" style="padding:14px">Không tìm thấy.</p>';
    const sc=list.scrollTop;list.innerHTML=html;list.scrollTop=sc;
  };
  const create=raw=>{
    const it={item:raw,qty:'',group:MY_GROUPS[2],on:true};
    let at=shop.items.findIndex(x=>MY_GROUPS.indexOf(x.group)<0);
    if(at<0)at=shop.items.length;
    shop.items.splice(at,0,it);
    pantryAdd(raw);save();
  };
  r();
  q.addEventListener('input',()=>{list.scrollTop=0;r()});
  q.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    const raw=q.value.trim();if(!raw)return;
    const ex=shop.items.find(x=>norm(x.item)===norm(raw));
    if(ex)ex.on=true;else create(raw);
    q.value='';r();
  });
  list.onclick=e=>{
    const b=e.target.closest('.srow');if(!b)return;
    if(b.dataset.add){const raw=q.value.trim();if(raw){create(raw);q.value='';r()}return}
    const it=shop.items[Number(b.dataset.i)];if(it){it.on=!it.on;r()}
  };

    const row=e.target.closest('.qrow');if(!row)return;

    if(qb){it.qty=stepQty(it.qty,Number(qb.dataset.q));r();return}
    if(e.target.closest('[data-rm]')){it.on=false;r()}
  };

    if(!e.target.classList.contains('qv'))return;
    const row=e.target.closest('.qrow'),it=shop.items[Number(row.dataset.i)];if(!it)return;
    it.qty=e.target.value;

  });
  $('#sh-sel').addEventListener('change',e=>{if(e.target.classList.contains('qv'))r()});
  // Đổi số người ăn: co giãn mọi định lượng theo tỉ lệ
  document.querySelector('.serv').addEventListener('click',e=>{
    const b=e.target.closest('[data-sv]');if(!b)return;

    shop.servings=next;$('#sh-sv').textContent=next;r();
  });

    if(hf.portionMl){hb.portionMl=hf.portionMl;hb.waterMl=hf.waterMl}
    state.habits.push(hb);
    tab='habits';
  }else{
    const w=$('#f-when').value||p.when;
    const cl=(p.shopping&&shop)?shop.items.filter(x=>x.on).map(x=>({item:x.item,qty:x.qty,done:false})):p.checklist;
    state.tasks.push({id:uid(),title:st.title,emoji:st.emoji,when:w,leadMin:parseInt($('#f-lead').value,10)||0,repeat:$('#f-rep').value,
      summary:p.summary,checklist:cl,tips:p.tips,shop:!!p.shopping,servings:(p.shopping&&shop)?shop.servings:undefined,done:false});
    if(p.shopping&&cl.length){cl.forEach(x=>pantryAdd(x.item));saveDish(st.title,cl,shop&&shop.servings)}
    const d=new Date(w);
    if(fromCal){calSel=dKey(d);calY=d.getFullYear();calM=d.getMonth();tab='cal'}
    else tab=dKey(d)<=dKey(new Date())?'today':'soon';
  }
  $('#ta').value='';
  closeSheet();save();render();tick();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- render ---------- */
function daysText(d){
  if(d.length===7)return 'Hằng ngày';
  const k=d.slice().sort().join(',');
  if(k==='1,2,3,4,5')return 'Ngày thường';
  if(k==='0,6')return 'Cuối tuần';
  return DAY_ORDER.filter(x=>d.indexOf(x)>=0).map(x=>DAY_LABEL[x]).join(' ');
}
function habitDone(h){return Math.min(hTimes(h).length,h.log[dKey(new Date())]||0)}
function ring(h){
  const pct=habitDone(h)/hTimes(h).length,C=2*Math.PI*28;
  return '<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--line)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="28" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(C*pct).toFixed(1)+' '+C.toFixed(1)+'"/></svg><div class="e">'+esc(h.emoji)+'</div></div>';
}
function habitCard(h,full){
  const now=new Date(),ts=hTimes(h),goal=ts.length,done=habitDone(h),all=done>=goal;
  const onToday=habitActive(h,now);
  const pm=h.portionMl;
  const status=!onToday?'Hôm nay nghỉ':pm?(done*pm)+' / '+(goal*pm)+' ml hôm nay':goal===1?('Lúc '+ts[0]+', '+(all?'đã xong':'chưa làm')):done+' / '+goal+' lần hôm nay';
  let h2='<div class="hcard'+(full?' full':'')+'" data-hid="'+h.id+'" role="button" tabindex="0" aria-label="Mở chi tiết '+esc(h.title)+'"><div class="hhead">'+ring(h)+'<div><h3>'+esc(h.title)+'</h3><p>'+status+'</p></div></div>';
  if(full){
    const nxt=onToday?ts.slice().sort().find(t=>{const [H,M]=t.split(':').map(Number);const a=new Date(now);a.setHours(H,M,0,0);return a>now}):null;
    h2+='<div class="chips">'+ts.slice().sort().map(t=>'<span class="chip'+(t===nxt?' lead':'')+'">'+esc(t)+'</span>').join('')+'<span class="chip ai">'+(h.once?'Chỉ hôm nay':daysText(h.days))+'</span>'+(h.spread?'<span class="chip ai">Tự chia theo giờ dậy</span>':'')+(pm?'<span class="chip ai">'+pm+' ml mỗi lần</span>':'')+'</div>';
    h2+='<p style="margin:0;color:var(--muted);font-size:13px">'+(!onToday?'Hôm nay là ngày nghỉ.':all?'Hôm nay bạn đã đủ rồi.':(nxt?'Nhắc tiếp theo lúc '+nxt+'.':'Hôm nay đã hết mốc nhắc.'))+'</p>';
  }
  h2+='<div class="hbtns">'+(all?'<button disabled>Đã đủ ✓</button>':'<button data-act="hadd" data-id="'+h.id+'" data-n="1">'+(pm?'Uống '+pm+' ml':'Xong'+(goal>1?' 1 lần':''))+'</button>');
  if(full&&done>0) h2+='<button class="ghost" data-act="hadd" data-id="'+h.id+'" data-n="-1" aria-label="Hoàn tác">−</button>';
  h2+='</div>';
  if(full) h2+='<button class="linkbtn" data-act="hdel" data-id="'+h.id+'">Xoá thói quen</button>';
  return h2+'</div>';
}
function taskCard(t){
  const d=t.when?new Date(t.when):null,now=new Date();
  const lead=d&&t.leadMin?new Date(d.getTime()-t.leadMin*60000):null;
  const late=d&&!t.done&&d<now;
  let chips='';
  if(late)chips+='<span class="chip late">Quá giờ</span>';
  if(lead)chips+='<span class="chip lead">Nhắc lúc '+hm(lead)+'</span>';
  if(t.repeat!=='none')chips+='<span class="chip">'+REPEAT[t.repeat]+'</span>';
  const L=t.checklist||[];
  if(L.length){const left=L.filter(c=>!c.done).length;chips+='<span class="chip ai">✨ '+(left?left+' mục cần chuẩn bị':'Đã chuẩn bị xong')+'</span>'}
  if(t.note&&t.note.trim())chips+='<span class="chip">📝 '+esc(t.note.trim().split('\n')[0].slice(0,26))+'</span>';
  return '<article class="task'+(t.done?' done':'')+'" data-id="'+t.id+'" tabindex="0" role="button" aria-label="Mở chi tiết '+esc(t.title)+'">'+
    '<div class="time"><b>'+(d?hm(d):'—')+'</b><span>'+(d?dayLabel(d):'Cả ngày')+'</span></div>'+
    '<div class="tbody"><h3>'+esc(t.emoji)+' '+esc(t.title)+'</h3>'+(chips?'<div class="chips">'+chips+'</div>':'')+'</div>'+
    '<button class="check" data-act="done" data-id="'+t.id+'" aria-label="'+(t.done?'Bỏ đánh dấu':'Đánh dấu hoàn thành')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></article>';
}
function sortTasks(a,b){return (a.when||'9')<(b.when||'9')?-1:1}

function render(){
  const now=new Date(),tk=dKey(now);
  /* header */
  const hr=now.getHours();
  $('#greet').textContent=(hr<11?'Chào buổi sáng':hr<14?'Chào buổi trưa':hr<18?'Chào buổi chiều':'Chào buổi tối')+(nm()?', '+nm():'');
  $('#me').textContent=(nm()||'?').charAt(0).toUpperCase();
  $('#dateline').textContent=WD[now.getDay()]+', ngày '+now.getDate()+' tháng '+(now.getMonth()+1);
  const upcoming=state.tasks.filter(t=>!t.done&&t.when&&new Date(t.when)>=now).sort(sortTasks)[0];
  $('#next').innerHTML=upcoming?'<span class="dot"></span><span>Tiếp theo: <b>'+hm(new Date(upcoming.when))+' '+esc(upcoming.title)+'</b></span>':'<span class="dot"></span><span>Chưa có việc nào sắp tới</span>';

  renderSleep();
  /* today */
  const todayTasks=state.tasks.filter(t=>!t.when||dKey(new Date(t.when))<=tk);
  const open=todayTasks.filter(t=>!t.done).sort(sortTasks),done=todayTasks.filter(t=>t.done).sort(sortTasks);
  let h='';
  if('Notification' in window){
    let perm='';try{perm=Notification.permission}catch(e){}
    if(perm==='default')h+='<div class="banner"><p>Bật thông báo để Remi nhắc bạn ngay cả khi đang ở tab khác.</p><button data-act="notif">Bật</button></div>';
  }
  const hToday=state.habits.filter(x=>habitActive(x,now));
  $('#today-habits').innerHTML=hToday.length?'<h2>Thói quen hôm nay</h2><div class="hrow">'+hToday.map(x=>habitCard(x,false)).join('')+'</div>':'';
  h+='<h2>Việc hôm nay<span class="sub">'+open.length+' việc còn lại</span></h2>';
  h+=open.length?open.map(taskCard).join(''):'<div class="empty"><b>'+(done.length?'Xong hết rồi!':'Chưa có việc nào hôm nay')+'</b>'+(done.length?'Bạn đã hoàn thành mọi việc hôm nay.':'Chọn một mục ở trên hoặc gõ vào ô trống, Remi sẽ lo phần còn lại.')+'</div>';
  if(done.length)h+='<h2>Đã xong</h2>'+done.map(taskCard).join('');
  $('#view-today').innerHTML=h;

  /* soon */
  const fut=state.tasks.filter(t=>t.when&&!t.done&&dKey(new Date(t.when))>tk).sort(sortTasks);
  let s='<h2>Sắp tới<span class="sub">'+fut.length+' việc</span></h2>';
  if(!fut.length)s+='<div class="empty"><b>Chưa có việc nào sắp tới</b>Thử nói: “Mai họp với khách lúc 9h30”.</div>';
  else{
    s+='<div class="daygrid">';let last='',openG=false;
    fut.forEach(t=>{const lb=dayLabel(new Date(t.when));if(lb!==last){if(openG)s+='</section>';s+='<section class="daygrp"><h3 class="daylbl">'+esc(lb)+'</h3>';openG=true;last=lb}s+=taskCard(t)});
    if(openG)s+='</section>';
    s+='</div>';
  }
  $('#view-soon').innerHTML=s;

  /* habits */
  let hb='<h2>Thói quen</h2>';
  hb+=state.habits.length?state.habits.map(x=>habitCard(x,true)).join(''):'<div class="empty"><b>Chưa có thói quen nào</b>Thử nói: “Nhắc tôi uống nước 2l mỗi ngày”.</div>';
  hb+='<button class="send" style="margin-top:6px" data-act="newhabit" type="button">Thêm thói quen</button>';
  $('#view-habits').innerHTML=hb;

  renderCal();
  ['today','soon','habits','cal'].forEach(k=>{$('#view-'+k).hidden=(k!==tab)});
  $('#quick').hidden=(tab!=='today');$('#sleep').hidden=(tab!=='today'||(state.sleep.awake&&!nearBed()));$('#suggest').hidden=(tab!=='today');$('#today-habits').hidden=(tab!=='today');document.body.dataset.tab=tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
}
