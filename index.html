/* ---------- calendar ---------- */
let calY=null,calM=null,calSel=null;
function calInit(){if(calY===null){const n=new Date();calY=n.getFullYear();calM=n.getMonth();calSel=dKey(n)}}
function calFix(){const n=new Date();calSel=(calY===n.getFullYear()&&calM===n.getMonth())?dKey(n):calY+'-'+pad(calM+1)+'-01'}
function projTasks(key){
  const out=[],wd=new Date(key+'T00:00:00').getDay();
  state.tasks.forEach(t=>{
    if(!t.when)return;
    const tk=dKey(new Date(t.when));
    if(tk===key){out.push({t:t,time:hm(new Date(t.when)),proj:false});return}
    if(t.repeat!=='none'&&!t.done&&key>tk){
      if(t.repeat==='daily'||(t.repeat==='weekly'&&new Date(tk+'T00:00:00').getDay()===wd))out.push({t:t,time:hm(new Date(t.when)),proj:true});
    }
  });
  return out.sort((a,b)=>a.time<b.time?-1:1);
}
function habitsOn(key){
  const today=dKey(new Date()),wd=new Date(key+'T00:00:00').getDay();
  return state.habits.filter(h=>{
    if(key<today)return (h.log[key]||0)>0;
    return h.once?h.date===key:h.days.indexOf(wd)>=0;
  });
}
function fullDay(key){
  const d=new Date(key+'T00:00:00');
  return WD[d.getDay()]+', ngày '+d.getDate()+' tháng '+(d.getMonth()+1);
}
function renderCal(){
  if(tab!=='cal')return;
  const host=$('#view-cal'),ae=document.activeElement;
  if(ae&&host.contains(ae)&&/^(TEXTAREA|INPUT)$/.test(ae.tagName))return;
  calInit();
  const now=new Date(),todayKey=dKey(now);
  const first=new Date(calY,calM,1),offset=(first.getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();
  let h='<div class="calgrid"><div class="calleft"><div class="calnow" id="cal-now"></div>';
  h+='<div class="calh"><button type="button" data-act="calprev" aria-label="Tháng trước">‹</button><h2>Tháng '+(calM+1)+', '+calY+'</h2><button type="button" data-act="calnext" aria-label="Tháng sau">›</button><button type="button" class="todaybtn" data-act="caltoday">Hôm nay</button></div>';
  h+='<div class="wk">'+['T2','T3','T4','T5','T6','T7','CN'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="cgrid">';
  for(let i=0;i<offset;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){
    const k=calY+'-'+pad(calM+1)+'-'+pad(d);
    const nt=projTasks(k).length,nh=habitsOn(k).length>0,nn=!!(state.dayNotes[k]&&state.dayNotes[k].trim());
    h+='<button type="button" class="cd'+(k===todayKey?' today':'')+(k===calSel?' sel':'')+'" data-day="'+k+'" aria-label="Ngày '+d+'"><b>'+d+'</b><span class="dots">'+(nt?'<i class="d1"></i>':'')+(nh?'<i class="d2"></i>':'')+(nn?'<i class="d3"></i>':'')+'</span></button>';
  }
  h+='</div><div class="legend"><span><i class="d1"></i>Việc</span><span><i class="d2"></i>Thói quen</span><span><i class="d3"></i>Ghi chú</span></div></div><div class="calright">';
  const sel=calSel,isToday=sel===todayKey,isPast=sel<todayKey;
  const hts=x=>(isToday?hTimes(x):x.times).slice().sort();
  const entries=projTasks(sel).map(it=>({time:it.time,kind:'t',it:it}));
  const multi=[];
  habitsOn(sel).forEach(x=>{
    const ts=hts(x);
    if(ts.length===1)entries.push({time:ts[0],kind:'h',x:x,ts:ts});
    else multi.push({x:x,ts:ts});
  });
  entries.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
  h+='<div class="daypanel"><div class="dayhead"><h3>'+fullDay(sel)+(isToday?' (hôm nay)':'')+'</h3><button type="button" class="addt" data-act="caladd">+ Việc</button></div>';
  const nowStr=hm(now);let placed=!isToday;
  const nowLine='<div class="nowline"><span>Bây giờ '+nowStr+'</span></div>';
  if(!entries.length&&!multi.length){h+=(isToday?nowLine:'')+'<p class="dhint" style="margin:8px 0">Chưa có gì trong ngày này.</p>'}
  entries.forEach(en=>{
    if(!placed&&en.time>nowStr){h+=nowLine;placed=true}
    if(en.kind==='t'){
      const t=en.it.t,nt=t.note&&t.note.trim();
      h+='<button type="button" class="ag'+(t.done?' dn':'')+'" data-act="opentask" data-id="'+t.id+'"><span class="at">'+en.time+'</span><span class="ae">'+esc(t.emoji)+'</span><span class="an">'+esc(t.title)+(en.it.proj?' <em>(lặp lại)</em>':'')+(nt?'<span class="anote">📝 '+esc(nt.split('\n')[0].slice(0,60))+'</span>':'')+'</span></button>';
    }else{
      const x=en.x,dn=isToday?habitDone(x):(isPast?(x.log[sel]||0):0);
      const st=isPast?(dn?'Đã làm':'Chưa làm'):isToday?(dn?'Đã xong':'Chưa làm'):'Thói quen';
      const nt=x.note&&x.note.trim();
      h+='<div class="ag hb'+(isToday&&dn?' dn':'')+'" data-hid="'+x.id+'" style="cursor:pointer"><span class="at">'+en.time+'</span><span class="ae">'+esc(x.emoji)+'</span><span class="an">'+esc(x.title)+'<span class="anote">'+st+(nt?', 📝 '+esc(nt.split('\n')[0].slice(0,40)):'')+'</span></span></div>';
    }
  });
  if(!placed&&entries.length)h+=nowLine;
  if(multi.length){
    h+='<div class="shead2">Thói quen nhiều lần trong ngày</div>'+multi.map(m=>{
      const x=m.x,ts=m.ts,n=ts.length,dn=isToday?habitDone(x):(isPast?(x.log[sel]||0):0);
      const range=ts.length?ts[0]+' đến '+ts[n-1]:'';
      const sub=isPast?'Đã làm '+dn+' lần':(isToday?dn+' / '+n+' lần hôm nay, '+range:n+' lần, '+range);
      return '<div class="ag hb" data-hid="'+x.id+'" style="cursor:pointer"><span class="at">'+(ts[0]||'')+'</span><span class="ae">'+esc(x.emoji)+'</span><span class="an">'+esc(x.title)+'<span class="anote">'+sub+'</span></span></div>';
    }).join('');
  }
  h+='<div class="field" style="margin-top:14px"><label for="day-note">Ghi chú cho ngày này</label><textarea class="note" id="day-note" rows="3">'+esc(state.dayNotes[sel]||'')+'</textarea></div></div></div></div>';
  host.innerHTML=h;
  tickClock();
}

document.addEventListener('click',e=>{
  const ex=e.target.closest('[data-ex]');
  if(ex){submit(ex.dataset.ex);return}
  const nw=e.target.closest('[data-new]');
  if(nw){openManual(nw.dataset.new);return}
  const card=e.target.closest('.task[data-id]');
  if(card&&!e.target.closest('.check')&&!e.target.closest('input,button,a,label')){openTask(card.dataset.id);return}
  const hc=e.target.closest('[data-hid]');
  if(hc&&!e.target.closest('button,input,a,label')){openHabit(hc.dataset.hid);return}
  const dd=e.target.closest('[data-day]');
  if(dd){calSel=dd.dataset.day;render();return}
  if(e.target.closest('#me')){openProfile();return}
  const tb=e.target.closest('nav.tabs button');
  if(tb){tab=tb.dataset.tab;render();window.scrollTo({top:0});return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='toggle'){openIds.has(id)?openIds.delete(id):openIds.add(id);render()}
  else if(act==='done'){completeTask(id)}
  else if(act==='tdel'){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}
  else if(act==='hadd'){addHabit(id,Number(el.dataset.n))}
  else if(act==='addit'){addItem(id)}
  else if(act==='opentask'){openTask(id)}
  else if(act==='calprev'){calM--;if(calM<0){calM=11;calY--}calFix();render()}
  else if(act==='calnext'){calM++;if(calM>11){calM=0;calY++}calFix();render()}
  else if(act==='caltoday'){const n=new Date();calY=n.getFullYear();calM=n.getMonth();calSel=dKey(n);render()}
  else if(act==='caladd'){openManual('reminder',calSel);fromCal=true}
  else if(act==='hdel'){state.habits=state.habits.filter(h=>h.id!==id);save();render()}
  else if(act==='newhabit'){openManual('habit')}
  else if(act==='notif'){try{Promise.resolve(Notification.requestPermission()).then(render)}catch(err){}}
});

    $('#p-ptest').onclick=async()=>{msg('Đang gửi thử…');try{await testPush();msg('Đã gửi. Khóa màn hình để xem thông báo.')}catch(e){msg('⚠️ '+(e&&e.message||'Không gửi được'))}};
    $('#p-poff').onclick=async()=>{await disablePush();msg('Đã tắt.');showPushState($('#p-pushstate'))};
  })();
  sh.querySelectorAll('.tone').forEach(b=>b.onclick=()=>{tone=b.dataset.tone;sh.querySelectorAll('.tone').forEach(x=>x.classList.toggle('on',x===b));upd()});
  $('#p-ok').onclick=()=>{const v=$('#p-name').value.trim();if(!v){$('#p-name').focus();return}store.set('nhip.aimode',aim);store.set('nhip.aikey',($('#p-key').value||'').trim());state.profile={name:v,tone:tone,wake:$('#p-wake').value||'06:30',bed:$('#p-bed').value||'22:30'};state.habits.forEach(h=>{if(h.spread)h.plan=null});save();closeSheet();tick();render()};
  $('#p-out').onclick=()=>{state.profile=null;save();closeSheet();render();showWelcome()};
  document.body.classList.add('sheet-open');
}

/* ---------- thông báo đẩy ngoài app (máy chủ Cloudflare riêng, xem thư mục worker/) ---------- */
const PUSH_KEY='nhip.push',PUSH_STATE='nhip.pushstate';
const pushCfg=()=>store.get(PUSH_KEY,null);
const pushBase=c=>String(c.url||'').trim().replace(/\/+$/,'');
const authH=c=>({'content-type':'application/json',authorization:'Bearer '+c.token});
const b64uToBytes=v=>{const p=String(v).replace(/-/g,'+').replace(/_/g,'/');const s=atob(p+'='.repeat((4-p.length%4)%4));const o=new Uint8Array(s.length);for(let i=0;i<s.length;i++)o[i]=s.charCodeAt(i);return o};
const bytesToB64u=b=>{let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
function buildReminders(){
  const out=[],now=Date.now(),horizon=now+14*86400000;
  const add=(id,at,title,body)=>{if(at>=now-60000&&at<=horizon)out.push({id:id,at:at,title:title,body:body})};
  state.tasks.forEach(t=>{
    if(t.done||!t.when)return;
    let due=new Date(t.when);if(isNaN(due))return;
    const step=t.repeat==='daily'?1:(t.repeat==='weekly'?7:0);
    if(step&&due.getTime()<now){const k=Math.ceil((now-due.getTime())/(step*86400000));due.setDate(due.getDate()+k*step)}
    const lead=t.leadMin||0,n=(t.checklist||[]).length;
    for(let g=0;g<30&&due.getTime()<=horizon;g++){
      const ts=due.getTime();
      if(lead>0)add(t.id+':'+ts+':lead',ts-lead*60000,t.emoji+' '+t.title,'Còn '+leadText(lead)+' nữa'+(n?' · '+n+' mục cần chuẩn bị':''));
      add(t.id+':'+ts+':due',ts,t.emoji+' '+t.title,'Đến giờ rồi · '+hm(due));
      if(!step)break;
      due=new Date(ts);due.setDate(due.getDate()+step);
    }
  });
  state.habits.forEach(h=>{
    for(let i=0;i<3;i++){
      const d=new Date();d.setDate(d.getDate()+i);
      if(!habitActive(h,d))continue;
      const ts=hTimes(h).slice().sort(),skip=i===0?habitDone(h):0;
      ts.slice(skip).forEach(tm=>{
        const a=tm.split(':').map(Number),at=new Date(d);at.setHours(a[0],a[1],0,0);
        add(h.id+':'+dKey(d)+':'+tm,at.getTime(),(h.emoji||'🎯')+' '+h.title,'Đến giờ rồi · '+tm);
      });
    }
  });
  out.sort((a,b)=>a.at-b.at);
  return out.slice(0,300);
}
function setPushState(o){store.set(PUSH_STATE,o);const el=document.getElementById('p-pushstate');if(el)showPushState(el)}
function showPushState(el){
  const c=pushCfg(),st=store.get(PUSH_STATE,null);
  if(!c||!c.on){el.textContent='Chưa bật. Cần máy chủ nhắc việc riêng (xem hướng dẫn trong thư mục worker/).';return}
  if(!st){el.textContent='Đã bật, đang đồng bộ…';return}
  el.textContent=st.ok?('✅ Đã đồng bộ '+st.count+' lời nhắc lúc '+hm(new Date(st.at))+'.'):('⚠️ '+(st.err||'Chưa đồng bộ được')+'.');
}
let pushT=null;
function pushSync(now){clearTimeout(pushT);pushT=setTimeout(doPushSync,now?0:1500)}
async function doPushSync(){
  const c=pushCfg();if(!c||!c.on||!c.url||!c.token)return;
  try{
    let sub=null;
    if('serviceWorker' in navigator&&'PushManager' in window){
      const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),3000))]);
      if(reg)sub=await reg.pushManager.getSubscription();
    }
    const r=await fetch(pushBase(c)+'/sync',{method:'POST',headers:authH(c),body:JSON.stringify({subscription:sub?sub.toJSON():undefined,reminders:buildReminders()})});
    const j=await r.json().catch(()=>({}));
    setPushState(r.ok?{ok:true,count:j.count,at:Date.now()}:{ok:false,err:r.status===401?'Mã bí mật chưa đúng':(j.error||('Lỗi '+r.status))});
  }catch(e){setPushState({ok:false,err:'Không kết nối được máy chủ nhắc việc'})}
}
async function enablePush(url,token){
  url=String(url||'').trim().replace(/\/+$/,'');token=String(token||'').trim();
  if(!/^https:\/\/.+/.test(url))throw new Error('Địa chỉ máy chủ phải bắt đầu bằng https://');
  if(!token)throw new Error('Hãy nhập mã bí mật');
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(ios&&!standalone)throw new Error('Trên iPhone, hãy mở Remi từ biểu tượng ở Màn hình chính (Chia sẻ → Thêm vào Màn hình chính) rồi bật lại');
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))throw new Error('Trình duyệt này chưa hỗ trợ thông báo đẩy');
  const perm=await Notification.requestPermission();
  if(perm!=='granted')throw new Error('Chưa được cho phép. Vào Cài đặt iPhone → Thông báo → Remi để bật');
  let kr;try{kr=await fetch(url+'/vapid')}catch(e){throw new Error('Không kết nối được máy chủ')}
  if(!kr.ok)throw new Error('Máy chủ không trả khóa (kiểm tra địa chỉ)');
  const pk=(await kr.json()).publicKey;
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub){
    const cur=sub.options&&sub.options.applicationServerKey?bytesToB64u(new Uint8Array(sub.options.applicationServerKey)):null;
    if(cur&&cur!==pk){await sub.unsubscribe();sub=null}
  }
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(pk)});
  store.set(PUSH_KEY,{url:url,token:token,on:true});
  await doPushSync();
  const st=store.get(PUSH_STATE,null);
  if(!st||!st.ok)throw new Error((st&&st.err)||'Chưa đồng bộ được');
}
async function disablePush(){
  const c=pushCfg();
  try{
    if(c&&c.url&&c.token)await fetch(pushBase(c)+'/sync',{method:'POST',headers:authH(c),body:JSON.stringify({reminders:[]})});
    const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),2000))]);
    const sub=reg&&await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe();
  }catch(e){}
  store.set(PUSH_KEY,Object.assign({},c||{},{on:false}));store.set(PUSH_STATE,null);
}
async function testPush(){
  const c=pushCfg();if(!c||!c.on)throw new Error('Hãy bật thông báo trước');
  const r=await fetch(pushBase(c)+'/test',{method:'POST',headers:authH(c)});
  if(!r.ok)throw new Error(r.status===400?'Chưa có thiết bị đăng ký. Bấm “Bật thông báo” trước':'Máy chủ đẩy báo lỗi '+r.status);
}
/* hộp thư: câu nói gửi từ Siri/Phím tắt tới máy chủ, Remi mở ra thì hỏi xác nhận */
async function checkInbox(){
  const c=pushCfg();
  if(!c||!c.on||busy||document.body.classList.contains('sheet-open'))return;
  try{
    const r=await fetch(pushBase(c)+'/inbox',{headers:authH(c)});if(!r.ok)return;
    const it=((await r.json()).items||[])[0];if(!it)return;
    await fetch(pushBase(c)+'/inbox/ack',{method:'POST',headers:authH(c),body:JSON.stringify({ids:[it.id]})});
    submit(it.text);
  }catch(e){}
}
const _save=save;save=function(){_save.apply(this,arguments);pushSync()};
const _close=closeSheet;closeSheet=function(){_close.apply(this,arguments);setTimeout(checkInbox,700)};
setTimeout(()=>{pushSync(true);checkInbox()},2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pushSync(true);checkInbox()}});

/* start */
render();tick();
if(!state.profile)showWelcome();
(function(){try{const q=(new URLSearchParams(location.search).get('q')||'').trim();if(q&&state.profile){history.replaceState(null,'',location.pathname);setTimeout(()=>submit(q),500)}}catch(e){}})();
setInterval(tick,15000);
tickClock();setInterval(tickClock,1000);
setInterval(render,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
})();
</script>
