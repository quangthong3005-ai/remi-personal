<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remi cá nhân</title>
<meta name="theme-color" content="#FF6A1F">
<meta name="description" content="Remi nhắc việc, thói quen và đi chợ giúp bạn, có AI hiểu câu nói tự nhiên.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/cal-ui.css">
</head>
<body>

<div id="alerts" aria-live="polite"></div>

<div id="app">
  <header class="top">
    <div class="hrow2"><h1 id="greet">Xin chào</h1><button class="avatar" id="me" type="button" aria-label="Tài khoản"></button></div>
    <div class="dl"><p id="dateline"></p><div class="clock" id="clock" aria-label="Giờ hiện tại"></div></div>
    <div class="next" id="next"></div>
  </header>

  <div class="col col-main">
  <section class="composer" id="composer" aria-label="Nhập việc cần nhớ">
    <div class="cwrap">
      <span class="spark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7L12 2zm7 12l1 2.9 2.9 1-2.9 1-1 2.9-1-2.9-2.9-1 2.9-1 1-2.9z"/></svg></span>
      <textarea id="ta" rows="1" aria-label="Nói hoặc gõ điều bạn cần nhớ"></textarea>
      <div class="cbtns">
        <button class="icon-btn" id="mic" aria-label="Nói bằng giọng" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>
        </button>
        <button class="send" id="send" type="button">
          Thêm
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="thinking"><span class="pulse"><i></i><i></i><i></i></span>Remi đang hiểu ý bạn</div>
  </section>

  <section id="suggest" aria-label="Gợi ý có sẵn">
    <h2>Gợi ý cho bạn</h2>
    <div class="sgrid">
      <button type="button" data-ex="Uống nước mỗi ngày"><span class="se">💧</span>Uống nước</button>
      <button type="button" data-ex="Đi chợ"><span class="se">🍛</span>Đi chợ</button>
      <button type="button" data-ex="Đi bộ 30 phút mỗi sáng"><span class="se">🚶</span>Đi bộ</button>
      <button type="button" data-ex="Gọi điện cho bố mẹ vào chủ nhật hằng tuần"><span class="se">📞</span>Gọi bố mẹ</button>
      <button type="button" data-ex="Tạo lịch họp"><span class="se">🤝</span>Tạo lịch họp</button>
      <button type="button" data-ex="Thiền 10 phút trước khi ngủ mỗi tối"><span class="se">🧘</span>Thiền</button>
    </div>
  </section>

  <main>
    <div id="view-today"></div>
    <div id="view-soon" hidden></div>
    <div id="view-habits" hidden></div>
    <div id="view-cal" hidden></div>
    <div id="view-kitchen" hidden></div>
    <div id="view-stats" hidden></div>
  </main>
  </div>
  <aside class="col col-side">
  <section class="sleep" id="sleep" aria-label="Trạng thái ngủ và thức dậy"><div class="sinfo"><b id="sl-t"></b><span id="sl-s"></span></div><div class="strack" id="sl-track" role="switch" aria-checked="false" tabindex="0" aria-label="Đã thức dậy"><div class="sthumb" id="sl-thumb">😴</div></div></section>

  <section class="quick" id="quick" aria-label="Tạo nhanh">
    <button class="qtile t-rem" type="button" data-new="reminder"><span class="qi">⏰</span><b>Đặt nhắc hẹn</b></button>
    <button class="qtile t-cal" type="button" data-new="event"><span class="qi">📅</span><b>Hẹn lịch</b></button>
    <button class="qtile t-hab" type="button" data-new="habit"><span class="qi">🌱</span><b>Thêm thói quen</b></button>
  </section>

  <div id="today-habits"></div>
  </aside>
</div>

<nav class="tabs" aria-label="Điều hướng">
  <span class="brand"><img src="/icons/icon-192.png" alt="" width="44" height="44"><b>Remi</b></span>
  <div role="tablist">
    <button role="tab" aria-selected="true" data-tab="today">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Hôm nay
    </button>
    <button role="tab" aria-selected="false" data-tab="cal">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      Lịch
    </button>
    <button role="tab" aria-selected="false" data-tab="soon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      Sắp tới
    </button>
    <button role="tab" aria-selected="false" data-tab="habits">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.2 6 11a6 6 0 01-12 0c0-4.8 6-11 6-11z"/></svg>
      Thói quen
    </button>
    <button role="tab" aria-selected="false" data-tab="kitchen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.9A4 4 0 0 1 7.5 6a5 5 0 0 1 9 0A4 4 0 0 1 18 13.9V20H6z"/><path d="M6 17h12"/></svg>
      Bếp
    </button>
    <button role="tab" aria-selected="false" data-tab="stats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      Thống kê
    </button>
  </div>
</nav>

<div id="welcome" hidden></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Xác nhận"></div>
<script src="/js/api.js"></script>
<script src="/js/qty.js"></script>
<script src="/js/local-parse.js"></script>
<script src="/js/stats.js"></script>
<script src="/js/kitchen.js"></script>
<script src="/js/kitchen-ui.js"></script>
<script src="/js/cal-utils.js"></script>
<script src="/js/cal-ui.js"></script>
<script src="/js/app.js"></script>
<script src="/js/personal.js"></script>
</body>
</html>
